<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NemoClaw Dashboard — Sandbox Lifecycle & Policy Management</title>
  <meta name="description" content="NemoClaw GUI Dashboard — manage sandboxed AI agents with policy-constrained network access, inference routing, and workspace management.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>
  <!-- ── Sidebar Navigation ──────────────────────────────── -->
  <nav class="glass-nav" id="sidebar">
    <div class="nav-brand">
      <div class="brand-icon">🦖</div>
      <span class="brand-text">NemoClaw</span>
      <span class="brand-version">v1.0</span>
    </div>
    <div class="nav-links">
      <a href="#/" class="nav-link active" data-page="dashboard" id="nav-dashboard">
        <span class="nav-icon">📊</span>
        <span>Dashboard</span>
      </a>
      <a href="#/onboard" class="nav-link" data-page="onboard" id="nav-onboard">
        <span class="nav-icon">🚀</span>
        <span>Onboard</span>
      </a>
      <a href="#/chat" class="nav-link" data-page="chat" id="nav-chat">
        <span class="nav-icon">💬</span>
        <span>Chat</span>
      </a>
      <a href="#/policies" class="nav-link" data-page="policies" id="nav-policies">
        <span class="nav-icon">🛡️</span>
        <span>Policies</span>
      </a>
      <a href="#/inference" class="nav-link" data-page="inference" id="nav-inference">
        <span class="nav-icon">🧠</span>
        <span>Inference</span>
      </a>
      <a href="#/workspace" class="nav-link" data-page="workspace" id="nav-workspace">
        <span class="nav-icon">📝</span>
        <span>Workspace</span>
      </a>
      <a href="#/monitoring" class="nav-link" data-page="monitoring" id="nav-monitoring">
        <span class="nav-icon">📡</span>
        <span>Monitoring</span>
      </a>
      <a href="#/deploy" class="nav-link" data-page="deploy" id="nav-deploy">
        <span class="nav-icon">☁️</span>
        <span>Deploy</span>
      </a>
    </div>
    <div class="nav-footer">
      <div class="system-status" id="system-status">
        <div class="status-dot" id="status-dot"></div>
        <span id="status-text">Checking...</span>
      </div>
    </div>
  </nav>

  <!-- ── Main Content ────────────────────────────────────── -->
  <main class="main-content" id="main-content">
    <div class="page-container" id="page-container">
      <!-- Pages loaded dynamically by SPA router -->
      <div class="loading-state">
        <div class="spinner"></div>
        <p>Loading NemoClaw Dashboard...</p>
      </div>
    </div>
  </main>

  <!-- ── Toast Container ─────────────────────────────────── -->
  <div class="toast-container" id="toast-container"></div>

  <!-- ── Modal Overlay ───────────────────────────────────── -->
  <div class="modal-overlay" id="modal-overlay" style="display:none">
    <div class="modal-content glass-card" id="modal-content"></div>
  </div>

  <!-- ── Scripts ─────────────────────────────────────────── -->
  <script src="/js/app.js"></script>
  <script src="/js/pages/dashboard.js"></script>
  <script src="/js/pages/onboard.js"></script>
  <script src="/js/pages/chat.js"></script>
  <script src="/js/pages/sandbox-detail.js"></script>
  <script src="/js/pages/policies.js"></script>
  <script src="/js/pages/inference.js"></script>
  <script src="/js/pages/workspace.js"></script>
  <script src="/js/pages/monitoring.js"></script>
  <script src="/js/pages/deploy.js"></script>
</body>
</html>
